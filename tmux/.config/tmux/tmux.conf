
set  -g default-terminal "tmux-256color"
set  -g base-index      1
setw -g pane-base-index 1





set -g status-keys vi
set -g mode-keys   vi







set  -g mouse             on
set  -g focus-events      off
setw -g aggressive-resize off
setw -g clock-mode-style  24
set  -s escape-time       0
set  -g history-limit     10000

# ============================================= #
# Load plugins with Home Manager                #
# --------------------------------------------- #

# tmuxplugin-sensible
# ---------------------

run-shell /nix/store/555b6mv51kxkskbd2xd0ih5rivd25n0p-tmuxplugin-sensible-unstable-2022-08-14/share/tmux-plugins/sensible/sensible.tmux


# tmuxplugin-vim-tmux-navigator
# ---------------------

run-shell /nix/store/36sh3rw3c2lz358fc2lpyiaihj4qdrb2-tmuxplugin-vim-tmux-navigator-unstable-2025-07-15/share/tmux-plugins/vim-tmux-navigator/vim-tmux-navigator.tmux


# tmuxplugin-tmux-fzf
# ---------------------

run-shell /nix/store/0wp10f2p9r8rzmj02zrax3cb9w37km5m-tmuxplugin-tmux-fzf-unstable-2025-09-24/share/tmux-plugins/tmux-fzf/main.tmux


# tmuxplugin-yank
# ---------------------

run-shell /nix/store/kpihxmha9ydn1rh24s50whfiwg03bprf-tmuxplugin-yank-unstable-2023-07-19/share/tmux-plugins/yank/yank.tmux

# ============================================= #

# Split panes using | and - (in current working directory)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Easy reload of tmux config with prefix + r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Tmux config reloaded!"
